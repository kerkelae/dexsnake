name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not fork"
      - run: python -m ruff check .
        if: matrix.python-version == '3.14'
      - run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.resources import files

          expected = {
              "dexsnake.uniswap_v2": 3,
              "dexsnake.uniswap_v3": 3,
              "dexsnake.utils": 1,
          }
          for package, count in expected.items():
              assert len(list(files(package).joinpath("abi").glob("*.json"))) == count
          PY
        if: matrix.python-version == '3.14'

  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m fork tests/test_fork.py
        env:
          RUN_FORK_TESTS: "1"
